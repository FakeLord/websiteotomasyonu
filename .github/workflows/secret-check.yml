name: Imza sirlari kontrolu

# Elle çalıştırılır (workflow_dispatch). Güncelleme imza sırlarının uzunluğunu ve SHA-256 parmak izini yazar; değerin
# kendisi yazılmaz. Yerel dosyalardaki parmak izleriyle karşılaştırılarak sırların doğru yapıştırıldığı doğrulanır.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Uzunluk ve parmak izi
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -u
          show() {
            local name="$1" value="$2"
            printf '%s: uzunluk=%s sha256=%s ilk8=%s son4_bosluk_var=%s\n' "$name" "${#value}" \
              "$(printf '%s' "$value" | sha256sum | cut -c1-16)" "$(printf '%s' "$value" | cut -c1-8)" \
              "$(printf '%s' "$value" | grep -c '[[:space:]]' || true)"
          }
          show KEY "$KEY"
          show PASS "$PASS"
