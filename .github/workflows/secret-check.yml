name: Imza sirlari kontrolu

# Elle çalıştırılır (workflow_dispatch). Güncelleme imza sırlarının uzunluğunu ve SHA-256 parmak izini yazar; değerin
# hiçbir parçası yazılmaz. Yerel dosyalardaki parmak izleriyle karşılaştırılarak sırların doğru girildiği doğrulanır.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Uzunluk ve parmak izi
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -u
          echo "KEY : uzunluk=${#KEY} sha256=$(printf '%s' "$KEY" | sha256sum | cut -c1-16)"
          echo "PASS: uzunluk=${#PASS} sha256=$(printf '%s' "$PASS" | sha256sum | cut -c1-16)"
